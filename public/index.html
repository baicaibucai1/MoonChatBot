<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonChatBot 控制台</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/design.css">
</head>
<body>
<div class="shell">

  <!-- 左侧导航 -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark"></span>
      <span class="logo-text">MoonChatBot 控制台</span>
    </div>

    <!-- 角色列表：唯一的左侧导航。点进去后，主区顶部是角色卡，
         角色卡上挂标签页（对话 / 记忆 / 渠道 / 心跳），「设置」是角色卡旁的按钮 -->
    <div class="side-group">
      <div class="side-label">
        <span>角色</span>
        <button class="add-btn" id="btn-add-bot" title="添加角色">＋</button>
      </div>
      <div class="side-list" id="bot-list"></div>
    </div>

    <div class="side-btns">
      <button class="settings-btn" onclick="openSettings()" title="设置">⚙ 设置</button>
      <button class="settings-btn" onclick="openModels()" title="模型管理">▤ 模型</button>
      <button class="settings-btn" onclick="openWorkspace()" title="工作区：管理员 AI 的草稿台">▢ 工作区</button>
    </div>

    <div class="admin-launch">
      <button class="settings-btn admin-entry" onclick="openAdminPanel()" title="面板管理员：配置模型 / 写提示词 / 总结内容">◈ 面板管理员</button>
    </div>

    <div class="side-foot">
      <span class="dot" id="status-dot"></span>
      <span class="conn" id="conn-text">连接中…</span>
      <button class="foot-btn" id="btn-theme" title="切换亮/暗主题">☾</button>
      <button class="foot-btn" id="btn-refresh" title="刷新">↻</button>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main" id="main"></main>

</div>

<div id="toast" class="toast"></div>
<script src="/app.js"></script>
<script src="/design-accent.js"></script>
</body>
</html>
